<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDo List — з backend</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>📝 ToDo List (сервер)</h1>

    <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="Введіть нове завдання..." autocomplete="off" required>
      <button type="submit">Додати</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Усі</button>
      <button class="filter-btn" data-filter="active">Активні</button>
      <button class="filter-btn" data-filter="completed">Виконані</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="footer">
      <span id="todo-count">0 завдань</span>
      <button id="clear-completed">Очистити виконані</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
